[package]
name = "tileboard"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A modular dashboard: apps describe their data, you build the tiles."
publish = false

# Third-party gate (see CLAUDE.md): every crate below was named and approved by the owner (2026-11-24).
# Cargo.lock is committed and pins every crate, including indirect ones.
[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
# The HTTP client that calls each app's /widgets. Plain http:// only: no TLS crate is in the tree.
http-body-util = "0.1.5"
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "http1", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
# Reads config.toml.
toml = { version = "1.2.2", default-features = false, features = ["parse", "serde", "std"] }
